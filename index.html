let currentFilter="all";

const list=document.getElementById("list");
const search=document.getElementById("search");

search.addEventListener("input",render);

function setFilter(f){
  currentFilter=f;
  render();
}

function render(){
  list.innerHTML="";
  const key=search.value.toLowerCase();

  members.forEach(m=>{

    const levels = Array.isArray(m.level) ? m.level : [m.level];

    const text=(m.name+" "+m.meta).toLowerCase();

    const okSearch=text.includes(key);

    const okFilter =
      currentFilter==="all" ||
      levels.includes(currentFilter);

    if(okSearch && okFilter){

      const div=document.createElement("div");
      div.className=`card ${levels[0]}`;

      let rolesHTML="";
      m.role.forEach(r=>{
        rolesHTML += `<span class="badge ${r.type}">${r.text}</span>`;
      });

      div.innerHTML=`
      <div class="top">
        <img class="avatar" src="${m.avatar}">
        <div>
          <div class="name">${m.name}</div>
          <div class="meta">${m.meta}</div>
          <div class="badges">${rolesHTML}</div>
        </div>
      </div>
      `;

      div.onclick=()=>openModal(m);
      list.appendChild(div);
    }
  });
}

function openModal(m){
document.getElementById("modal").style.display="flex";
document.getElementById("m_avatar").src=m.avatar;
document.getElementById("m_name").innerText=m.name;
document.getElementById("m_meta").innerText=m.meta;

let rolesHTML="";
m.role.forEach(r=>{
 rolesHTML += `<span class="badge ${r.type}">${r.text}</span>`;
});

document.getElementById("m_roles").innerHTML=rolesHTML;

let html="";
m.sections.forEach(s=>{
html+=`
<div class="section-title">${s.title}</div>
<div class="section-content">${s.content}</div>
`;
});

document.getElementById("custom").innerHTML=html;
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

window.onclick=function(e){
if(e.target.id==="modal") closeModal();
}

render();

</script>

</body>
</html>
